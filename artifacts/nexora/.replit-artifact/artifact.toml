kind = "web"
previewPath = "/"
title = "Nexora"
description = "A modern academic resource hub for engineering students to discover notes, question papers, lab materials, and other verified study resources by branch, year, semester, and subject."
version = "1.0.0"
id = "artifacts/nexora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23292

[services.development]
run = "pnpm --filter @workspace/nexora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nexora", "run", "build" ]
serve = "static"
publicDir = "artifacts/nexora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23292"
BASE_PATH = "/"
